server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # DNS interno de Docker; valid=10s hace que Nginx vuelva a resolver "backend"
    # y detecte réplicas nuevas o contenedores recreados con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Con varias réplicas, Docker devuelve varias IP y Nginx reparte las peticiones (round-robin).
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        # Si una réplica falla, se reintenta en otra.
        proxy_next_upstream error timeout http_502 http_503;
    }
}
