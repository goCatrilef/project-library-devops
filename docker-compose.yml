name: minibiblioteca

services:
  backend:
    image: minibiblioteca-backend:${APP_VERSION:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Sin container_name: permite crear varias réplicas del backend.
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s
    deploy:
      # ESCALABILIDAD: réplicas parametrizables (CI usa 2, EC2 Free Tier usa 1).
      replicas: ${BACKEND_REPLICAS:-1}
    mem_limit: 480m
    cpus: 0.60
    networks:
      - minibiblioteca-net

  frontend:
    image: minibiblioteca-frontend:${APP_VERSION:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minibiblioteca-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    # Healthcheck del frontend: Docker sabe si Nginx realmente responde.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 96m
    cpus: 0.20
    networks:
      - minibiblioteca-net

networks:
  minibiblioteca-net:
    driver: bridge